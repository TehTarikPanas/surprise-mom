<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surprise Mom!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="assets/bread-icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="page">
      <header>
        <h1>Pick any 2 of these cards</h1>
      </header>

      <main>
        <section class="cards">
          <div
            class="card"
            data-message="Congrats, You got Aula S99 RGB Membrane Keyboard!"
          ></div>

          <div class="card" data-message="Congrats, You got Cat Villas!"></div>

          <div
            class="card"
            data-message="Congrats, You got Levoit Core 200S Smart Air Purifier!"
          ></div>

          <div
            class="card"
            data-message="Congrats, You got Shoes Cabinet!"
          ></div>

          <div
            class="card"
            data-message="Congrats, You got Foldable Pet Stroller!"
          ></div>

          <div
            class="card"
            data-message="Congrats, You got Xiaomi TV A Pro 32”!"
          ></div>

          <div
            class="card"
            data-message="Congrats, You got MOSSDOOM Naomi Bag Women!"
          ></div>

          <div
            class="card"
            data-message="Congrats, You got Gas Stove (Choose Any Brand)!"
          ></div>
        </section>
      </main>

      <footer>
        <span>Made by syahirahketu</span>
        <span>2026</span>
      </footer>
    </div>

    <!-- Pop Up Message -->
    <div id="overlay" class="hidden">
      <div class="popup">
        <button class="close">&times;</button>

        <p id="popupMessage"></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
